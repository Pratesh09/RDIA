          <form id="obj-form" class="space-y-3">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <input id="o-name" type="text" placeholder="Object Name" required class="w-full text-xs px-3.5 py-2.5 rounded-lg bg-[#06090f] border border-[#1a253a] text-white placeholder-slate-500" />
              <select id="o-cat" class="font-mono text-xs px-3 py-2.5 rounded-lg bg-[#06090f] border border-[#1a253a] text-white">
                <option value="SENSORS">SENSORS</option>
                <option value="MODULES">MODULES</option>
                <option value="PROTOTYPES">PROTOTYPES</option>
              </select>
            </div>
            <select id="o-itemclass" class="w-full font-mono text-xs px-3 py-2.5 rounded-lg bg-[#06090f] border border-[#1a253a] text-white"></select>
            <textarea id="o-desc" rows="3" placeholder="Object Description" required class="w-full text-xs px-3.5 py-2.5 rounded-lg bg-[#06090f] border border-[#1a253a] text-white placeholder-slate-500"></textarea>
            <button type="submit" class="w-full py-3 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-mono font-bold text-xs uppercase">Register Research Object</button>
          </form>
        </div>
      </div>
    `;

    document.getElementById('branches-grid').innerHTML = BRANCH_CARDS.map(b => `
      <button type="button" onclick="openBranchNews('${b.code}')" class="glass-card rounded-xl p-5 text-left hover:border-cyan-400/60 transition">
        <span class="font-mono text-xs font-bold ${b.colorClass}" style="${b.customStyle}">BRANCH [${b.code}]</span>
        <h3 class="text-lg font-bold text-white mt-1 mb-2">${b.title}</h3>
        <p class="text-sm text-slate-400">${b.desc}</p>
        <span class="inline-block font-mono text-[11px] text-cyan-400 mt-3">${b.code === 'R' ? 'VIEW RESEARCH NEWS &rarr;' : 'VIEW BRANCH NEWS &rarr;'}</span>
      </button>
    `).join('');

    window.openBranchNews = function(code) {
      const data = BRANCH_NEWS[code];
      if (!data) return;
      document.getElementById('news-body').innerHTML = `
        <div class="font-mono text-xs text-cyan-400 mb-1">BRANCH [${code}] • ${BRANCHES[code]}</div>
        <h3 class="text-2xl font-bold text-white mb-4">${data.heading}</h3>
        <div class="space-y-3">
          ${data.items.map(item => `
            <div class="p-4 rounded-xl bg-[#06090f] border border-[#1a253a]">
              <div class="font-mono text-[10px] text-emerald-400 mb-1">${item.tag}</div>
              <h4 class="text-base font-bold text-white mb-1">${item.title}</h4>
              <p class="text-xs text-slate-300 leading-relaxed">${item.body}</p>
            </div>
          `).join('')}
        </div>
      `;
      const m = document.getElementById('news-modal');
      m.classList.remove('hidden');
      m.classList.add('flex');
    };

    window.closeNewsModal = function() {
      const m = document.getElementById('news-modal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    };

    const PROJECT_FILTERS = ['ALL', 'ACTIVE', 'FIELD TESTING'];
    document.getElementById('project-filters').innerHTML = PROJECT_FILTERS.map((f, i) => `
      <button data-filter="${f}" class="filter-btn font-mono text-xs px-3 py-2 rounded-lg ${i === 0 ? 'bg-cyan-500 text-slate-950 font-bold' : 'bg-[#0c121e] border border-[#1a253a] text-slate-300'}">${f}</button>
    `).join('');

    const OBJ_FILTERS = ['ALL', 'SENSORS', 'MODULES', 'PROTOTYPES'];
    document.getElementById('obj-filters').innerHTML = OBJ_FILTERS.map((f, i) => `
      <button data-obj="${f}" class="obj-btn font-mono text-[11px] px-2.5 py-1 rounded ${i === 0 ? 'bg-cyan-500 text-slate-950 font-bold' : 'bg-[#06090f] border border-[#1a253a] text-slate-300'}">${f}</button>
    `).join('');

    document.getElementById('p-branch').innerHTML = Object.entries(BRANCHES).map(([k, v]) => `<option value="${k}">${k} — ${v}</option>`).join('');
    document.getElementById('p-typecode').innerHTML = Object.entries(PROJECT_TYPES).map(([k, v]) => `<option value="${k}">${k} — ${v}</option>`).join('');
    document.getElementById('o-itemclass').innerHTML = Object.entries(ITEM_CLASSES).map(([k, v]) => `<option value="${k}">${k} (${v.disruption.split(' // ')[1]} / ${v.risk.split(' // ')[1]})</option>`).join('');

    function renderProjects(filter = 'ALL') {
      const grid = document.getElementById('projects-grid');
      const list = filter === 'ALL' ? projects : projects.filter(p => p.status === filter);
      grid.innerHTML = list.map(p => `
        <div class="glass-card rounded-xl p-6 flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between gap-2 mb-3">
              <span class="font-mono text-xs font-bold text-cyan-400 bg-cyan-500/10 border border-cyan-500/30 px-2.5 py-0.5 rounded">${p.code}</span>
              <span class="font-mono text-[11px] text-emerald-400">${p.status}</span>
            </div>
            <h3 class="text-xl font-bold text-white">${p.name}</h3>
            <p class="font-mono text-xs text-slate-400 mt-1 mb-3">${p.domain}</p>
            <p class="text-sm text-slate-300 leading-relaxed mb-5">${p.desc}</p>
          </div>
          <button onclick="openDossier('${p.code}')" class="font-mono text-xs text-cyan-400 hover:underline text-left">OPEN PROJECT BRIEF &rarr;</button>
        </div>
      `).join('');
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.className = 'filter-btn font-mono text-xs px-3 py-2 rounded-lg bg-[#0c121e] border border-[#1a253a] text-slate-300';
        });
        btn.className = 'filter-btn font-mono text-xs px-3 py-2 rounded-lg bg-cyan-500 text-slate-950 font-bold';
        renderProjects(btn.dataset.filter);
      });
    });

    window.openDossier = function(code) {
      const p = projects.find(x => x.code === code);
      if (!p) return;
      document.getElementById('dossier-body').innerHTML = `
        <div class="font-mono text-xs text-cyan-400 mb-1">${p.code} • ${p.status}</div>
        <h3 class="text-2xl font-bold text-white mb-2">${p.name}</h3>
        <p class="text-xs font-mono text-slate-400 mb-4">DOMAIN: ${p.domain}</p>
        <p class="text-sm text-slate-300 leading-relaxed">${p.desc}</p>
      `;
      const m = document.getElementById('dossier-modal');
      m.classList.remove('hidden');
      m.classList.add('flex');
    };

    window.closeDossier = function() {
      const m = document.getElementById('dossier-modal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    };

    function renderPortalProjects() {
      const canEditStatus = currentOperative && (currentOperative.rank === 'MX' || currentOperative.rank === 'A');
      document.getElementById('status-perm-badge').textContent = canEditStatus
        ? `STATUS CONTROL ENABLED (${currentOperative.rank})`
        : 'READ-ONLY STATUS (MX & A ONLY)';

      document.getElementById('portal-projects-list').innerHTML = projects.map(p => `
        <div class="p-3.5 rounded-xl bg-[#06090f] border border-[#1a253a] flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <div class="flex items-center gap-2">
              <span class="font-mono text-xs font-bold text-cyan-400">${p.code}</span>
              <span class="text-sm font-bold text-white">${p.name}</span>
            </div>
            <p class="font-mono text-[11px] text-slate-400 mt-0.5">Current Status: <span class="text-emerald-400">${p.status}</span></p>
          </div>
          ${canEditStatus ? `
            <div class="flex flex-wrap gap-2">
              <button type="button" onclick="setProjectStatus('${p.code}', 'ACTIVE')" class="font-mono text-[11px] px-3 py-1.5 rounded ${p.status === 'ACTIVE' ? 'bg-emerald-500 text-slate-950 font-bold' : 'bg-[#0c121e] border border-[#1a253a] text-slate-300'}">ACTIVE</button>
              <button type="button" onclick="setProjectStatus('${p.code}', 'FIELD TESTING')" class="font-mono text-[11px] px-3 py-1.5 rounded ${p.status === 'FIELD TESTING' ? 'bg-amber-400 text-slate-950 font-bold' : 'bg-[#0c121e] border border-[#1a253a] text-slate-300'}">FIELD TESTING</button>
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    window.setProjectStatus = function(code, nextStatus) {
      if (!currentOperative || (currentOperative.rank !== 'MX' && currentOperative.rank !== 'A')) return;
      const target = projects.find(p => p.code === code);
      if (!target) return;
      target.status = nextStatus;
      localStorage.setItem('rdia_projects_v5', JSON.stringify(projects));
      renderProjects('ALL');
      renderPortalProjects();
    };

    const idInput = document.getElementById('staff-id-input');
    function formatId(raw) {
      const clean = raw.replace(/[^A-Za-z0-9]/g, '');
      if (!clean) return '';
      let rank = '', rest = '';
      if (clean.startsWith('MX')) {
        rank = 'MX';
        rest = clean.slice(2);
      } else {
        rank = clean.charAt(0);
        rest = clean.slice(1);
      }
      const branch = rest.slice(0, 1).toUpperCase();
      const wing = rest.slice(1, 2).toUpperCase();
      const flat = rest.slice(2, 5);
      const phone = rest.slice(5, 9);
      const uin = rest.slice(9, 13);
      return [rank, branch, wing, flat, phone, uin].filter(Boolean).join('-');
    }

    idInput.addEventListener('input', e => {
      e.target.value = formatId(e.target.value);
      document.getElementById('login-error').classList.add('hidden');
    });

    function parseId(val) {
      const m = val.match(/^(A|MX|C|M|m)-([RDILCW])-([A-F])-(\d{3})-(\d{4})-(\d{4})$/);
      if (!m) return null;
      return {
        full: val,
        rank: m[1],
        rankName: RANKS[m[1]],
        branch: m[2],
        branchName: BRANCHES[m[2]],
        wing: m[3],
        flat: m[4],
        phone: m[5],
        uin: m[6]
      };
    }

    document.getElementById('staff-login-form').addEventListener('submit', e => {
      e.preventDefault();
      const val = idInput.value.trim();
      const parsed = parseId(val);
      const errBox = document.getElementById('login-error');
      const errText = document.getElementById('login-error-text');

      if (!parsed) {
        errText.textContent = 'ACCESS DENIED: Invalid ID.';
        errBox.classList.remove('hidden');
        return;
      }

      if (parsed.rank === 'A' && !ADMINS[val]) {
        errText.textContent = 'ACCESS DENIED: Administrator limit reached.';
        errBox.classList.remove('hidden');
        return;
      }

      currentOperative = parsed;
      document.getElementById('dash-id').textContent = parsed.full;
      document.getElementById('dash-name').textContent = ADMINS[val] || `Operative (${parsed.rankName})`;
      document.getElementById('dash-decoded').textContent =
        `Rank: ${parsed.rank} (${parsed.rankName}) • Branch: ${parsed.branch} (${parsed.branchName}) • Wing ${parsed.wing}, Flat ${parsed.flat} • UIN ${parsed.uin}`;

      const addObjBtn = document.getElementById('btn-open-obj');
      const addProjBtn = document.getElementById('btn-open-proj');
      if (parsed.branch === 'R' || parsed.rank === 'A') {
        addObjBtn.classList.remove('hidden');
        addProjBtn.classList.remove('hidden');
      } else {
        addObjBtn.classList.add('hidden');
        addProjBtn.classList.add('hidden');
      }

      document.getElementById('portal-login-view').classList.add('hidden');
      document.getElementById('portal-dashboard-view').classList.remove('hidden');
      document.getElementById('nav-badge').textContent = `${parsed.rank}-${parsed.branch}-${parsed.wing}-${parsed.flat}`;
      renderPortalProjects();
      renderObjects('ALL');
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
      currentOperative = null;
      document.getElementById('portal-dashboard-view').classList.add('hidden');
      document.getElementById('portal-login-view').classList.remove('hidden');
      idInput.value = '';
      document.getElementById('nav-badge').textContent = 'STAFF ACCESS';
    });

    function renderObjects(cat) {
      const list = cat === 'ALL' ? researchObjects : researchObjects.filter(o => o.cat === cat);
      document.getElementById('objects-grid').innerHTML = list.map(o => {
        const ic = ITEM_CLASSES[o.itemClass] || ITEM_CLASSES['SAFE'];
        return `
          <button type="button" onclick="selectObj('${o.id}')" class="text-left p-3.5 rounded-xl bg-[#06090f] border border-[#1a253a] hover:border-cyan-400/50 transition">
            <div class="flex items-center justify-between gap-2">
              <span class="font-mono text-[10px] text-cyan-400">${o.id} • ${o.cat}</span>
              <span class="font-mono text-[9px] font-bold px-1.5 py-0.5 rounded ${ic.cls}">${o.itemClass}</span>
            </div>
            <div class="text-xs font-bold text-white mt-1">${o.name}</div>
            <div class="font-mono text-[10px] text-slate-400 mt-1">${ic.disruption} • ${ic.risk}</div>
          </button>
        `;
      }).join('');
      if (list.length) selectObj(list[0].id);
    }

    window.selectObj = function(id) {
      const o = researchObjects.find(x => x.id === id);
      if (!o) return;
      const ic = ITEM_CLASSES[o.itemClass] || ITEM_CLASSES['SAFE'];
      document.getElementById('insp-id').textContent = `${o.id} • ${o.cat}`;
      document.getElementById('insp-name').textContent = o.name;
      const icEl = document.getElementById('insp-itemclass');
      icEl.textContent = `ITEM CLASS: ${o.itemClass}`;
      icEl.className = `px-2.5 py-1.5 rounded font-bold ${ic.cls}`;
      document.getElementById('insp-disruption').textContent = ic.disruption;
      document.getElementById('insp-risk').textContent = ic.risk;
      document.getElementById('insp-desc').textContent = o.desc;
    };

    document.querySelectorAll('.obj-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.obj-btn').forEach(b => {
          b.className = 'obj-btn font-mono text-[11px] px-2.5 py-1 rounded bg-[#06090f] border border-[#1a253a] text-slate-300';
        });
        btn.className = 'obj-btn font-mono text-[11px] px-2.5 py-1 rounded bg-cyan-500 text-slate-950 font-bold';
        renderObjects(btn.dataset.obj);
      });
    });

    const pBranch = document.getElementById('p-branch');
    const pType = document.getElementById('p-typecode');
    const pSerial = document.getElementById('p-serial');

    function syncProjectPreview() {
      const ser = (pSerial.value.replace(/\D/g, '').slice(0, 3) || '005').padStart(3, '0');
      document.getElementById('prev-proj-code').textContent = `${pBranch.value}-${pType.value}-${ser}`;
      document.getElementById('prev-proj-meta').textContent = `${BRANCHES[pBranch.value]} • ${PROJECT_TYPES[pType.value]}`;
    }

    [pBranch, pType, pSerial].forEach(el => {
      el.addEventListener('input', syncProjectPreview);
      el.addEventListener('change', syncProjectPreview);
    });

    window.openProjectModal = function() {
      pSerial.value = String(projects.length + 1).padStart(3, '0');
      syncProjectPreview();
      const m = document.getElementById('project-modal');
      m.classList.remove('hidden');
      m.classList.add('flex');
    };

    window.closeProjectModal = function() {
      const m = document.getElementById('project-modal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    };

    document.getElementById('project-form').addEventListener('submit', e => {
      e.preventDefault();
      const ser = (pSerial.value.replace(/\D/g, '').slice(0, 3) || '005').padStart(3, '0');
      const code = `${pBranch.value}-${pType.value}-${ser}`;
      projects.unshift({
        code,
        name: document.getElementById('p-name').value.trim(),
        domain: document.getElementById('p-domain').value.trim(),
        status: 'ACTIVE',
        desc: document.getElementById('p-desc').value.trim()
      });
      localStorage.setItem('rdia_projects_v5', JSON.stringify(projects));
      renderProjects('ALL');
      renderPortalProjects();
      closeProjectModal();
      e.target.reset();
    });

    const oCat = document.getElementById('o-cat');
    const oItemClass = document.getElementById('o-itemclass');

    function syncObjectPreview() {
      const nextId = `OBJ-${String(researchObjects.length + 1).padStart(3, '0')}`;
      const icName = oItemClass.value;
      const ic = ITEM_CLASSES[icName] || ITEM_CLASSES['SAFE'];
      document.getElementById('prev-obj-id').textContent = nextId;
      document.getElementById('prev-obj-cat').textContent = oCat.value;
      document.getElementById('prev-itemclass').textContent = icName;
      document.getElementById('prev-disruption').textContent = ic.disruption;
      document.getElementById('prev-risk').textContent = ic.risk;
      document.getElementById('prev-itemclass-box').className = `p-2 rounded font-bold ${ic.cls}`;
    }

    [oCat, oItemClass].forEach(el => {
      el.addEventListener('input', syncObjectPreview);
      el.addEventListener('change', syncObjectPreview);
    });

    window.openObjectModal = function() {
      syncObjectPreview();
      const m = document.getElementById('obj-modal');
      m.classList.remove('hidden');
      m.classList.add('flex');
    };

    window.closeObjectModal = function() {
      const m = document.getElementById('obj-modal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    };

    document.getElementById('obj-form').addEventListener('submit', e => {
      e.preventDefault();
      const nextId = `OBJ-${String(researchObjects.length + 1).padStart(3, '0')}`;
      researchObjects.unshift({
        id: nextId,
        name: document.getElementById('o-name').value.trim(),
        cat: oCat.value,
        itemClass: oItemClass.value,
        status: 'REGISTERED',
        desc: document.getElementById('o-desc').value.trim()
      });
      localStorage.setItem('rdia_objects_v5', JSON.stringify(researchObjects));
      renderObjects('ALL');
      closeObjectModal();
      e.target.reset();
    });

    const slider = document.getElementById('dist-slider');
    slider.addEventListener('input', () => {
      const d = slider.value;
      document.getElementById('dist-label').textContent = `${d} cm`;
      document.getElementById('lcd-1').textContent = d < 25 ? `DIST: ${d}cm STOP!` : `DIST: ${d}cm  OK`;
      document.getElementById('lcd-2').textContent = 'RIVER: N/A';
    });

    renderProjects('ALL');
  </script>
</body>
</html>
